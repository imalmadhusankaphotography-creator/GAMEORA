name: Build GAMEORA (Windows)

# Every push to main (or a manual "Run workflow") builds the Windows installer,
# uploads it as an artifact, and publishes it as a GitHub Release.
# The installed app checks these Releases for updates.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gameora-windows
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Set GAMEORA version (1.0.<run number>)
        run: node scripts/gameora-version.mjs "1.0.${{ github.run_number }}"

      - name: Prepare bundled Node runtime
        run: bun run prepare:desktop-runtime win32-x64

      - name: Build app
        run: bun run build:desktop-app

      - name: Build Windows installer
        shell: pwsh
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: |
          bun run prepare:windows-installer
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          bun --bun node_modules/electron-builder/cli.js --win nsis --x64 --publish never
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-ChildItem release -File | Format-Table Name, Length

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: GAMEORA-Windows-Setup
          retention-days: 14
          if-no-files-found: error
          path: release/*.exe

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v=$(node -p "require('./package.json').version")
          gh release create "v$v" release/*.exe release/*.blockmap release/latest.yml \
            --target "$GITHUB_SHA" \
            --title "GAMEORA v$v" \
            --notes "GAMEORA Windows installer v$v. Download GAMEORA-Setup-$v.exe below."
